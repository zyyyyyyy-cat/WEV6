# GAC on WHU-MARS-2337 (separate training from scratch; do not load 1000 weights).
# One main run: 0.75 scene / 0.25 id, AUX_WEIGHT=0.1 (0.05->0.1 ramp),
# 4-GPU DDP, batch 256, LR 0.032, 120 epochs.
# Single GPU: override SOLVER.IMS_PER_BATCH 64 and SOLVER.BASE_LR 0.008.
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: 'jx_vit_base_p16_224-80ecf9dd.pth'
  METRIC_LOSS_TYPE: 'wrt'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  TRANSFORMER_TYPE: 'vit_base_in'
  STRIDE_SIZE: [16, 16]
  PCA_LOSS_WEIGHT: 0.01
  GPD_MOMENTUM: 0.2

  # HPD / V2 reset
  GPD_TYPE: 'hierarchical'
  GPD_SUB_CENTERS: 3
  GPD_SCENE_WEIGHT: 0.75
  GPD_SHARED_MOMENTUM: 0.2
  GPD_TAU: 0.03
  GPD_COUNT_EMA: True
  GPD_EMA_MIN: 0.1
  GPD_EMA_MAX: 0.5
  GPD_WARMSTART: True
  GPD_DIAG_PERIOD: 100

  # GAC (training-only; inference unchanged)
  AUX_WEIGHT: 0.1
  AUX_TAU: 0.03
  AUX_RAMP_EPOCHS: 5

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/project/code/data')
  DATASET_DIR: 'WHU-MARS_2337'
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.032
  IMS_PER_BATCH: 256
  SEED: 1234
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  LOSS_TYPE: "base+pca+gpd"
  RESUME: ''

TEST:
  IMS_PER_BATCH: 512
  RE_RANKING: False
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/GAC_2337_DDP'
